<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="300" rx="16" fill="#faf9f7" stroke="#e8e6e0" />
  <text x="40" y="50" font-size="18" font-weight="bold" fill="#1c1c19">Where review feedback is cheapest</text>

  <g>
    <rect x="48" y="104" width="160" height="64" rx="10" fill="#fdeee9" stroke="#c1553b" />
    <text x="128" y="142" font-size="15" fill="#1c1c19" text-anchor="middle">Design sketch</text>

    <rect x="256" y="104" width="160" height="64" rx="10" fill="#ffffff" stroke="#d8d5cc" />
    <text x="336" y="142" font-size="15" fill="#1c1c19" text-anchor="middle">Pull request</text>

    <rect x="464" y="104" width="160" height="64" rx="10" fill="#ffffff" stroke="#d8d5cc" />
    <text x="544" y="142" font-size="15" fill="#1c1c19" text-anchor="middle">Merged</text>

    <rect x="624" y="104" width="132" height="64" rx="10" fill="#ffffff" stroke="#d8d5cc" />
    <text x="690" y="142" font-size="15" fill="#1c1c19" text-anchor="middle">Production</text>
  </g>

  <g stroke="#6b6a62" stroke-width="2" fill="none">
    <path d="M208 136 H252" marker-end="url(#d)" />
    <path d="M416 136 H460" marker-end="url(#d)" />
    <path d="M624 136 H620" />
  </g>

  <g>
    <rect x="48" y="210" width="708" height="6" rx="3" fill="#e8e6e0" />
    <rect x="48" y="210" width="160" height="6" rx="3" fill="#c1553b" />
    <text x="48" y="248" font-size="13" fill="#c1553b">cost to fix: low</text>
    <text x="756" y="248" font-size="13" fill="#6b6a62" text-anchor="end">cost to fix: high</text>
  </g>

  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b6a62" />
    </marker>
  </defs>
</svg>
