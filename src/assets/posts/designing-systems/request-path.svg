<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="300" rx="16" fill="#faf9f7" stroke="#e8e6e0" />
  <text x="40" y="50" font-size="18" font-weight="bold" fill="#1c1c19">A request's path — and where it fails</text>

  <g>
    <rect x="40" y="104" width="150" height="68" rx="10" fill="#ffffff" stroke="#d8d5cc" />
    <text x="115" y="144" font-size="16" fill="#1c1c19" text-anchor="middle">Client</text>

    <rect x="236" y="104" width="150" height="68" rx="10" fill="#ffffff" stroke="#d8d5cc" />
    <text x="311" y="144" font-size="16" fill="#1c1c19" text-anchor="middle">Gateway</text>

    <rect x="432" y="104" width="150" height="68" rx="10" fill="#fdeee9" stroke="#c1553b" />
    <text x="507" y="144" font-size="16" fill="#1c1c19" text-anchor="middle">Service</text>

    <rect x="628" y="104" width="132" height="68" rx="10" fill="#ffffff" stroke="#d8d5cc" />
    <text x="694" y="144" font-size="16" fill="#1c1c19" text-anchor="middle">Datastore</text>
  </g>

  <g stroke="#6b6a62" stroke-width="2" fill="none">
    <path d="M190 138 H232" marker-end="url(#a)" />
    <path d="M386 138 H428" marker-end="url(#a)" />
    <path d="M582 138 H624" marker-end="url(#a)" />
  </g>

  <path d="M694 172 C694 232 507 232 507 178" fill="none" stroke="#c1553b"
    stroke-width="2" stroke-dasharray="6 5" marker-end="url(#b)" />
  <text x="600" y="252" font-size="13" fill="#c1553b" text-anchor="middle">timeout → bounded retry</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b6a62" />
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c1553b" />
    </marker>
  </defs>
</svg>
